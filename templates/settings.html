<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<body class="container mt-5">
    <div class="col-md-6 offset-md-3">
        <h3>Account Settings ⚙️</h3>
        <form action="/update_profile" method="POST" class="card p-4 shadow-sm">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="fname" class="form-control" value="{{ user.fname }}">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lname" class="form-control" value="{{ user.lname }}">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
            <a href="/profile" class="btn btn-link btn-block">Cancel</a>
        </form>
    </div>
</body>
</html>
